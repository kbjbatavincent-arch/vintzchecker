<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Grouping & GoDaddy Abuse Report Tool</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800">Link Grouping & GoDaddy Report Generator</h1>
            <p class="text-slate-500 text-sm mt-1">Paste form link di bawah. Sistem akan mengelompokkan link secara otomatis dan siap dibuatkan laporan GoDaddy Abuse.</p>
        </div>

        <!-- Input Area -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <label for="rawInput" class="block text-sm font-semibold text-slate-700">
                Input Form Link (Bisa Single Form atau Multi-Form):
            </label>
            <textarea id="rawInput" rows="8" 
                placeholder="Paste teks di sini..." 
                class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-sm leading-relaxed"></textarea>
            
            <div class="flex flex-wrap gap-3">
                <button onclick="processInput()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition flex items-center gap-2">
                    <span>+</span> Process & Group Link
                </button>
                <button onclick="clearAllData()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2.5 rounded-lg font-medium text-sm transition">
                    Hapus Semua Data
                </button>
            </div>
        </div>

        <!-- Container Hasil Grouping -->
        <div id="resultsContainer" class="space-y-6">
            <!-- Cards akan ditampilkan di sini -->
        </div>

    </div>

    <!-- Modal Form Laporan (Pop-up Input Manual) -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-2xl w-full p-6 space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">Lengkapi Data Report GoDaddy</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <input type="hidden" id="selectedTujuan">

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Company or Brand Being Impersonated *</label>
                    <input type="text" id="brandInput" placeholder="Contoh: Nama Brand / Website" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Evidence (Screenshots Link) *</label>
                    <input type="text" id="evidenceInput" placeholder="Contoh: https://prnt.sc/xyz atau https://drive.google.com/..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-3 border-t pt-4">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">Batal</button>
                <button onclick="generateReportText()" class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg transition">Generate Report Teks</button>
            </div>
        </div>
    </div>

    <script>
        let groupedData = JSON.parse(localStorage.getItem('groupedLinks')) || {};

        document.addEventListener('DOMContentLoaded', renderData);

        function extractUrl(text) {
            if (!text) return null;
            const match = text.match(/https?:\/\/[^\s]+/i);
            return match ? match[0] : null;
        }

        function processInput() {
            const input = document.getElementById('rawInput').value.trim();
            if (!input) return alert('Silakan paste teks form terlebih dahulu!');

            const lines = input.split('\n');
            
            let currentCategory = null;
            let currentDesktop = [];
            let currentAmp = [];
            let currentButton = [];
            let currentTujuan = null;

            let successCount = 0;

            function commitCurrentBlock() {
                if (currentTujuan) {
                    if (!groupedData[currentTujuan]) {
                        groupedData[currentTujuan] = { desktop: [], amp: [], button: [] };
                    }

                    currentDesktop.forEach(link => {
                        if (!groupedData[currentTujuan].desktop.includes(link)) groupedData[currentTujuan].desktop.push(link);
                    });
                    currentAmp.forEach(link => {
                        if (!groupedData[currentTujuan].amp.includes(link)) groupedData[currentTujuan].amp.push(link);
                    });
                    currentButton.forEach(link => {
                        if (!groupedData[currentTujuan].button.includes(link)) groupedData[currentTujuan].button.push(link);
                    });

                    successCount++;

                    currentDesktop = [];
                    currentAmp = [];
                    currentButton = [];
                    currentTujuan = null;
                    currentCategory = null;
                }
            }

            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine) return;

                if (/LINK PHISHING VIA DESKTOP/i.test(cleanLine)) {
                    if (currentTujuan) commitCurrentBlock();
                    currentCategory = 'desktop';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) currentDesktop.push(directUrl);
                    return;
                }

                if (/LINK AMP/i.test(cleanLine)) {
                    currentCategory = 'amp';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) currentAmp.push(directUrl);
                    return;
                }

                if (/LINK BUTTON/i.test(cleanLine)) {
                    currentCategory = 'button';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) currentButton.push(directUrl);
                    return;
                }

                if (/LINK TUJUAN/i.test(cleanLine)) {
                    currentCategory = 'tujuan';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) {
                        currentTujuan = directUrl;
                        commitCurrentBlock();
                    }
                    return;
                }

                const url = extractUrl(cleanLine);
                if (url && currentCategory) {
                    if (currentCategory === 'desktop') currentDesktop.push(url);
                    else if (currentCategory === 'amp') currentAmp.push(url);
                    else if (currentCategory === 'button') currentButton.push(url);
                    else if (currentCategory === 'tujuan') {
                        currentTujuan = url;
                        commitCurrentBlock();
                    }
                }
            });

            commitCurrentBlock();

            if (successCount === 0) {
                alert('Gagal memproses data. Pastikan format input memiliki baris "LINK TUJUAN :" beserta URL.');
                return;
            }

            saveAndRender();
            document.getElementById('rawInput').value = '';
        }

        function saveAndRender() {
            localStorage.setItem('groupedLinks', JSON.stringify(groupedData));
            renderData();
        }

        function renderData() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const tujuans = Object.keys(groupedData);

            if (tujuans.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 text-center rounded-xl border border-slate-200 text-slate-400">
                        Belum ada data link yang diproses.
                    </div>`;
                return;
            }

            tujuans.forEach((tujuan, index) => {
                const group = groupedData[tujuan];
                const groupKey = `group_${index}`;

                const cardHtml = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <!-- Header Group -->
                        <div class="bg-slate-800 text-white p-4 flex justify-between items-center break-all">
                            <div>
                                <span class="text-xs uppercase tracking-wider font-semibold text-slate-400 block">GROUP #${index + 1} - LINK TUJUAN</span>
                                <a href="${tujuan}" target="_blank" class="text-blue-400 hover:underline font-mono text-sm font-bold">${tujuan}</a>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="openReportModal('${tujuan}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
                                    📄 Buat Report Group Ini
                                </button>
                                <button onclick="deleteGroup('${tujuan}')" class="text-slate-400 hover:text-red-400 text-xs px-2 py-1.5 rounded border border-slate-700 transition">
                                    Hapus
                                </button>
                            </div>
                        </div>

                        <!-- Info Detail Links -->
                        <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-4 text-sm font-mono">
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <h4 class="font-sans font-semibold text-slate-700 text-xs uppercase mb-2">DESKTOP (${group.desktop.length})</h4>
                                <ul class="space-y-1 break-all">
                                    ${group.desktop.map(link => `<li class="bg-white p-1.5 rounded border border-slate-200 text-xs text-slate-600">${link}</li>`).join('')}
                                </ul>
                            </div>

                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <h4 class="font-sans font-semibold text-slate-700 text-xs uppercase mb-2">AMP (${group.amp.length})</h4>
                                <ul class="space-y-1 break-all">
                                    ${group.amp.map(link => `<li class="bg-white p-1.5 rounded border border-slate-200 text-xs text-slate-600">${link}</li>`).join('')}
                                </ul>
                            </div>

                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <h4 class="font-sans font-semibold text-slate-700 text-xs uppercase mb-2">BUTTON (${group.button.length})</h4>
                                <ul class="space-y-1 break-all">
                                    ${group.button.map(link => `<li class="bg-white p-1.5 rounded border border-slate-200 text-xs text-slate-600">${link}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <!-- Output Report Area -->
                        <div id="${groupKey}_output" class="hidden border-t border-slate-200 bg-slate-900 p-4 text-white font-mono text-xs space-y-2">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-emerald-400 font-semibold font-sans text-xs uppercase">Hasil Laporan GoDaddy:</span>
                                <button onclick="copyGeneratedText('${groupKey}_text')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-xs font-semibold transition">
                                    📋 Copy Teks Report
                                </button>
                            </div>
                            <textarea id="${groupKey}_text" rows="20" readonly class="w-full bg-slate-950 p-3 rounded border border-slate-800 text-emerald-300 focus:outline-none leading-relaxed"></textarea>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function openReportModal(tujuan) {
            document.getElementById('selectedTujuan').value = tujuan;
            document.getElementById('brandInput').value = '';
            document.getElementById('evidenceInput').value = '';
            document.getElementById('reportModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('reportModal').classList.add('hidden');
        }

        function generateReportText() {
            const tujuan = document.getElementById('selectedTujuan').value;
            const brand = document.getElementById('brandInput').value.trim();
            const evidence = document.getElementById('evidenceInput').value.trim();

            if (!brand) return alert('Silakan isi Company or Brand Being Impersonated!');
            if (!evidence) return alert('Silakan isi Evidence (Screenshots)!');

            const group = groupedData[tujuan];
            const index = Object.keys(groupedData).indexOf(tujuan);
            const groupKey = `group_${index}`;

            const desktopLinksStr = group.desktop.join(', ') || '-';
            const ampLinksStr = group.amp.join(', ') || '-';
            const buttonLinksStr = group.button.join(', ') || '-';

            const reportTemplate = `Halo Team, mohon di luangkan waktunya sebentar untuk bantu report

REPORT MELALUI : https://legalportal.godaddy.com/abuse?plid=1 

Select a category below to get started :
✅ Phishing

Your Email Address : EMAIL KERJA

Company or Brand Being Impersonated : ${brand}

URL, Website, or Domain : ${desktopLinksStr}

✅ Was this viewed from a mobile device?

What country did you view this content from? : INDONESIA

Description of Issue : 
This report concerns a domain hosted under your services that is being used to distribute illegal online gambling content and facilitate scam activities targeting Indonesian users.

The main domain initially appears as a normal landing page. However, it contains hidden links and buttons that redirect users through AMP mobile pages and tracking URLs to a final destination that is a real-money online gambling website.

The full redirection chain is as follows:
Main landing domain: ${desktopLinksStr}

AMP mobile version: ${ampLinksStr}

Button / redirect link: ${buttonLinksStr}

Final gambling destination: ${tujuan}

Evidence (Screenshots): ${evidence}

All stages of this redirection chain have been documented with screenshots as supporting visual evidence.
I respectfully request immediate investigation and permanent takedown of all related domains and services involved in this activity.

✅ I confirm that I am submitting this form in good faith and that all the information provided is accurate to the best of my knowledge. 

Thanks team`;

            const textarea = document.getElementById(`${groupKey}_text`);
            textarea.value = reportTemplate;

            document.getElementById(`${groupKey}_output`).classList.remove('hidden');
            closeModal();

            // Scroll ke area hasil output
            document.getElementById(`${groupKey}_output`).scrollIntoView({ behavior: 'smooth' });
        }

        function copyGeneratedText(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert('Teks Report berhasil disalin!');
        }

        function deleteGroup(tujuan) {
            if (confirm('Apakah Anda yakin ingin menghapus kelompok ini?')) {
                delete groupedData[tujuan];
                saveAndRender();
            }
        }

        function clearAllData() {
            if (confirm('Apakah Anda yakin ingin menghapus SELURUH data tersimpan?')) {
                groupedData = {};
                localStorage.removeItem('groupedLinks');
                renderData();
            }
        }
    </script>

</body>
</html>
