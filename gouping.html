<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Grouping & Generator Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800">Link Grouping & Generator Tool</h1>
            <p class="text-slate-500 text-sm mt-1">Paste form link di bawah. Sistem akan mengelompokkan link secara otomatis berdasarkan <b>LINK TUJUAN</b>.</p>
        </div>

        <!-- Input Area -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <label for="rawInput" class="block text-sm font-semibold text-slate-700">
                Input Form Link (Bisa Single Form atau Multi-Form):
            </label>
            <textarea id="rawInput" rows="10" 
                placeholder="Paste teks di sini..." 
                class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-sm leading-relaxed"></textarea>
            
            <div class="flex flex-wrap gap-3">
                <button onclick="processInput()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium text-sm transition flex items-center gap-2">
                    <span>+</span> Process & Group Link
                </button>
                <button onclick="clearAllData()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2.5 rounded-lg font-medium text-sm transition">
                    Hapus Semua Data
                </button>
            </div>
        </div>

        <!-- Container Hasil Grouping -->
        <div id="resultsContainer" class="space-y-6">
            <!-- Cards akan ditampilkan di sini -->
        </div>

    </div>

    <script>
        let groupedData = JSON.parse(localStorage.getItem('groupedLinks')) || {};

        document.addEventListener('DOMContentLoaded', renderData);

        // Fungsi mengekstrak MURNI URL saja dari sebuah baris teks
        function extractUrl(text) {
            if (!text) return null;
            const match = text.match(/https?:\/\/[^\s]+/i);
            return match ? match[0] : null;
        }

        function processInput() {
            const input = document.getElementById('rawInput').value.trim();
            if (!input) return alert('Silakan paste teks form terlebih dahulu!');

            const lines = input.split('\n');
            
            let currentCategory = null;
            let currentDesktop = [];
            let currentAmp = [];
            let currentButton = [];
            let currentTujuan = null;

            let successCount = 0;

            function commitCurrentBlock() {
                if (currentTujuan) {
                    if (!groupedData[currentTujuan]) {
                        groupedData[currentTujuan] = { desktop: [], amp: [], button: [] };
                    }

                    // Masukkan ke grup tanpa duplikasi
                    currentDesktop.forEach(link => {
                        if (!groupedData[currentTujuan].desktop.includes(link)) groupedData[currentTujuan].desktop.push(link);
                    });
                    currentAmp.forEach(link => {
                        if (!groupedData[currentTujuan].amp.includes(link)) groupedData[currentTujuan].amp.push(link);
                    });
                    currentButton.forEach(link => {
                        if (!groupedData[currentTujuan].button.includes(link)) groupedData[currentTujuan].button.push(link);
                    });

                    successCount++;

                    // Reset penampung untuk form selanjutnya
                    currentDesktop = [];
                    currentAmp = [];
                    currentButton = [];
                    currentTujuan = null;
                    currentCategory = null;
                }
            }

            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine) return;

                // Deteksi Header Kategori
                if (/LINK PHISHING VIA DESKTOP/i.test(cleanLine)) {
                    // Jika sebelumnya ada blok form lain yang selesai, commit dulu
                    if (currentTujuan) commitCurrentBlock();
                    
                    currentCategory = 'desktop';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) currentDesktop.push(directUrl);
                    return;
                }

                if (/LINK AMP/i.test(cleanLine)) {
                    currentCategory = 'amp';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) currentAmp.push(directUrl);
                    return;
                }

                if (/LINK BUTTON/i.test(cleanLine)) {
                    currentCategory = 'button';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) currentButton.push(directUrl);
                    return;
                }

                if (/LINK TUJUAN/i.test(cleanLine)) {
                    currentCategory = 'tujuan';
                    const directUrl = extractUrl(cleanLine.split(':')[1]);
                    if (directUrl) {
                        currentTujuan = directUrl;
                        commitCurrentBlock();
                    }
                    return;
                }

                // Deteksi Isi Baris Link (di bawah header)
                const url = extractUrl(cleanLine);
                if (url && currentCategory) {
                    if (currentCategory === 'desktop') currentDesktop.push(url);
                    else if (currentCategory === 'amp') currentAmp.push(url);
                    else if (currentCategory === 'button') currentButton.push(url);
                    else if (currentCategory === 'tujuan') {
                        currentTujuan = url;
                        commitCurrentBlock();
                    }
                }
            });

            // Eksekusi penutupan jika ada blok yang tersisa di akhir teks
            commitCurrentBlock();

            if (successCount === 0) {
                alert('Tidak ada LINK TUJUAN valid yang ditemukan. Pastikan format mengandung baris "LINK TUJUAN :" beserta URL.');
                return;
            }

            saveAndRender();
            document.getElementById('rawInput').value = '';
        }

        function saveAndRender() {
            localStorage.setItem('groupedLinks', JSON.stringify(groupedData));
            renderData();
        }

        function renderData() {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const tujuans = Object.keys(groupedData);

            if (tujuans.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 text-center rounded-xl border border-slate-200 text-slate-400">
                        Belum ada data link yang diproses.
                    </div>`;
                return;
            }

            tujuans.forEach((tujuan, index) => {
                const group = groupedData[tujuan];
                const groupKey = `group_${index}`;

                const cardHtml = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-800 text-white p-4 flex justify-between items-center break-all">
                            <div>
                                <span class="text-xs uppercase tracking-wider font-semibold text-slate-400 block">GROUP #${index + 1} - LINK TUJUAN</span>
                                <a href="${tujuan}" target="_blank" class="text-blue-400 hover:underline font-mono text-sm font-bold">${tujuan}</a>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="generateOutput('${tujuan}', '${groupKey}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
                                    ⚡ Generate List Output
                                </button>
                                <button onclick="deleteGroup('${tujuan}')" class="text-slate-400 hover:text-red-400 text-xs px-2 py-1.5 rounded border border-slate-700 transition">
                                    Hapus
                                </button>
                            </div>
                        </div>

                        <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-4 text-sm font-mono">
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <h4 class="font-sans font-semibold text-slate-700 text-xs uppercase mb-2">DESKTOP (${group.desktop.length})</h4>
                                <ul class="space-y-1 break-all">
                                    ${group.desktop.map(link => `<li class="bg-white p-1.5 rounded border border-slate-200 text-xs text-slate-600">${link}</li>`).join('')}
                                </ul>
                            </div>

                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <h4 class="font-sans font-semibold text-slate-700 text-xs uppercase mb-2">AMP (${group.amp.length})</h4>
                                <ul class="space-y-1 break-all">
                                    ${group.amp.map(link => `<li class="bg-white p-1.5 rounded border border-slate-200 text-xs text-slate-600">${link}</li>`).join('')}
                                </ul>
                            </div>

                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <h4 class="font-sans font-semibold text-slate-700 text-xs uppercase mb-2">BUTTON (${group.button.length})</h4>
                                <ul class="space-y-1 break-all">
                                    ${group.button.map(link => `<li class="bg-white p-1.5 rounded border border-slate-200 text-xs text-slate-600">${link}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <div id="${groupKey}_output" class="hidden border-t border-slate-200 bg-slate-900 p-4 text-white font-mono text-xs space-y-2">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-emerald-400 font-semibold font-sans text-xs uppercase">Output Format List Berpoin:</span>
                                <button onclick="copyGeneratedText('${groupKey}_text')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1 rounded text-xs transition">
                                    📋 Copy Teks
                                </button>
                            </div>
                            <textarea id="${groupKey}_text" rows="16" readonly class="w-full bg-slate-950 p-3 rounded border border-slate-800 text-emerald-300 focus:outline-none"></textarea>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function generateOutput(tujuan, groupKey) {
            const group = groupedData[tujuan];
            const outputArea = document.getElementById(`${groupKey}_output`);
            const textarea = document.getElementById(`${groupKey}_text`);

            let lines = [];

            lines.push("LINK PHISHING VIA DESKTOP :");
            if (group.desktop.length > 0) {
                group.desktop.forEach(link => lines.push(`* ${link}`));
            }

            lines.push("\nLINK AMP :");
            if (group.amp.length > 0) {
                group.amp.forEach(link => lines.push(`* ${link}`));
            }

            lines.push("\nLINK BUTTON :");
            if (group.button.length > 0) {
                group.button.forEach(link => lines.push(`* ${link}`));
            }

            lines.push("\nLINK TUJUAN :");
            lines.push(`* ${tujuan}`);

            textarea.value = lines.join('\n');
            outputArea.classList.remove('hidden');
        }

        function copyGeneratedText(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert('Output berhasil disalin!');
        }

        function deleteGroup(tujuan) {
            if (confirm('Apakah Anda yakin ingin menghapus kelompok ini?')) {
                delete groupedData[tujuan];
                saveAndRender();
            }
        }

        function clearAllData() {
            if (confirm('Apakah Anda yakin ingin menghapus SELURUH data tersimpan?')) {
                groupedData = {};
                localStorage.removeItem('groupedLinks');
                renderData();
            }
        }
    </script>

</body>
</html>
