<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Link & Footer Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6">

  <div class="max-w-2xl w-full bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 mt-10">
    <h1 class="text-2xl font-bold mb-2 text-cyan-400">Link & Footer Inspector</h1>
    <p class="text-slate-400 text-sm mb-6">Masukkan URL untuk mengecek status redirect dan mendeteksi link di dalam footer.</p>

    <form id="checkForm" class="flex gap-2 mb-6">
      <input type="text" id="urlInput" placeholder="Contoh: google.com" required
        class="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-cyan-500 text-slate-200">
      <button type="submit" id="btnSubmit"
        class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-lg font-medium transition-colors">
        Periksa
      </button>
    </form>

    <div id="loading" class="hidden text-center py-4 text-cyan-400 animate-pulse">
      Memeriksa URL & Link Footer...
    </div>

    <div id="result" class="hidden space-y-4">
      <div class="p-4 bg-slate-900 rounded-lg border border-slate-700">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Status Redirect Utama</h2>
        <p><strong>URL Awal:</strong> <span id="initialUrl" class="text-slate-300"></span></p>
        <p><strong>URL Akhir:</strong> <span id="finalUrl" class="text-cyan-400"></span></p>
        <p class="mt-2">
          <span id="badgeRedirect" class="px-2 py-1 text-xs font-semibold rounded"></span>
          <span id="badgeStatus" class="px-2 py-1 text-xs font-semibold bg-blue-900 text-blue-300 rounded ml-2"></span>
        </p>
      </div>

      <div class="p-4 bg-slate-900 rounded-lg border border-slate-700">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Analisis Footer</h2>
        <p><strong>Status Footer:</strong> <span id="footerStatus"></span></p>
        <p class="mt-2 text-sm text-slate-400 italic" id="footerPreview"></p>
        
        <div class="mt-4">
          <p class="text-xs text-slate-400 mb-2">Total Link di Footer: <span id="totalLinks" class="font-bold text-slate-200"></span></p>
          <ul id="linkList" class="space-y-2 max-h-60 overflow-y-auto bg-slate-950 p-2 rounded border border-slate-800"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('checkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('urlInput').value;
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');

      loading.classList.remove('hidden');
      result.classList.add('hidden');

      try {
        const res = await fetch('/api/check-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.success) {
          const d = data.data;
          document.getElementById('initialUrl').innerText = d.initialUrl;
          document.getElementById('finalUrl').innerText = d.finalUrl;
          
          const badgeRed = document.getElementById('badgeRedirect');
          if (d.isRedirected) {
            badgeRed.className = 'px-2 py-1 text-xs font-semibold rounded bg-amber-900 text-amber-300';
            badgeRed.innerText = 'Ter-Redirect';
          } else {
            badgeRed.className = 'px-2 py-1 text-xs font-semibold rounded bg-emerald-900 text-emerald-300';
            badgeRed.innerText = 'Tidak Ada Redirect';
          }

          document.getElementById('badgeStatus').innerText = `HTTP ${d.statusCode}`;
          document.getElementById('footerStatus').innerText = d.footerFound ? '✅ Tag Footer Ditemukan' : '❌ Footer Tidak Ditemukan';
          document.getElementById('footerPreview').innerText = d.footerTextPreview || 'Tidak ada teks footer.';
          document.getElementById('totalLinks').innerText = d.totalFooterLinks;

          const linkList = document.getElementById('linkList');
          linkList.innerHTML = '';

          d.footerLinks.forEach(link => {
            const li = document.createElement('li');
            li.className = 'p-2 bg-slate-900 rounded border border-slate-800 space-y-1 text-xs';
            
            let redirectInfo = '';
            if (link.isRedirected) {
              redirectInfo = `<span class="text-amber-400 font-semibold">[Ter-redirect]</span> &rarr; <a href="${link.finalUrl}" target="_blank" class="text-cyan-400 hover:underline">${link.finalUrl}</a>`;
            } else {
              redirectInfo = `<span class="text-emerald-400">[Langsung]</span>`;
            }

            li.innerHTML = `
              <div class="font-medium text-slate-200 text-sm">${link.text}</div>
              <div class="text-slate-400">Link Asal: <a href="${link.originalUrl}" target="_blank" class="text-slate-300 hover:underline">${link.originalUrl}</a></div>
              <div>${redirectInfo}</div>
            `;
            linkList.appendChild(li);
          });

          result.classList.remove('hidden');
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi.');
      } finally {
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
